name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check main.py tests && ruff format --check main.py tests
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python tests/pyxel_smoke.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check share.js
      - run: MAZE_SCREENSHOT=mobile-preview.png python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-preview
          path: mobile-preview.png
          if-no-files-found: ignore
